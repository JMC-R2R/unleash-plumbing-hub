<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Unleash Plumbing Content Hub | Ready to Rank</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800;900&family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0F0F12; --panel:#17171C; --panel2:#1E1E25; --line:#2A2A33;
    --ink:#F4F4F6; --mut:#9A9AA8; --r2r:#17B4F0; --accent:#019EE9;
    --ok:#3FB27F; --warn:#E2A03F; --err:#D9534F;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif;
       line-height:1.55;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1280px;margin:0 auto;padding:0 20px}
  h1,h2,h3,.disp{font-family:'Archivo',system-ui,sans-serif;font-weight:800;letter-spacing:-.01em}
  .micro{font-family:'Space Mono',monospace;font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
  a{color:var(--r2r)}
  .hide{display:none !important}

  /* ---------- login ---------- */
  .login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .loginbox{width:100%;max-width:390px;background:var(--panel);border:1px solid var(--line);
            border-radius:18px;padding:32px}
  .loginbox .lockup{margin-bottom:22px}
  .loginbox h1{font-size:21px;margin:0 0 6px}
  .loginbox p.sub{margin:0 0 22px;color:var(--mut);font-size:13.5px}
  label{display:block;font-size:12px;color:var(--mut);margin:0 0 6px}
  input[type=email],input[type=password]{width:100%;padding:11px 13px;border-radius:10px;
    border:1px solid var(--line);background:var(--panel2);color:var(--ink);font-size:14px;margin-bottom:14px}
  input:focus{outline:none;border-color:var(--r2r);box-shadow:0 0 0 3px rgba(23,180,240,.16)}
  .btn{font-family:'Archivo',sans-serif;font-size:13px;font-weight:700;padding:11px 20px;border-radius:22px;
       border:1px solid var(--r2r);background:var(--r2r);color:#06121A;cursor:pointer;transition:.15s}
  .btn:hover{filter:brightness(1.08)} .btn[disabled]{opacity:.5;cursor:default}
  .btn.ghost{background:transparent;color:var(--mut);border-color:var(--line)}
  .btn.ghost:hover{border-color:var(--accent);color:var(--accent)}
  .btn.wide{width:100%}
  .err{color:var(--err);font-size:13px;min-height:19px;margin-top:4px}

  /* ---------- co-brand lockup ---------- */
  .lockup{display:flex;align-items:center;gap:14px}
  .logoplate{background:#fff;border-radius:9px;padding:7px 11px;display:flex;align-items:center;line-height:0}
  .logoplate img{height:26px;width:auto;display:block}
  .lockup .rule{width:1px;height:26px;background:var(--line)}
  .r2r-logo{height:22px;width:auto;display:block}

  /* ---------- header ---------- */
  header{border-bottom:1px solid var(--line);background:linear-gradient(180deg,#141419,#0F0F12)}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:20px 0}
  .who{display:flex;align-items:center;gap:12px}
  .whochip{background:var(--panel2);border:1px solid var(--line);border-radius:20px;padding:6px 14px;font-size:12.5px}
  .whochip b{color:var(--accent)}
  header h1{margin:14px 0 4px;font-size:clamp(23px,3.4vw,34px)}
  header .sub{margin:0 0 20px;color:var(--mut);font-size:14px;max-width:760px}

  /* ---------- tabs ---------- */
  .tabsbar{position:sticky;top:0;z-index:30;background:rgba(15,15,18,.94);
           backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  .tabs{display:flex;gap:7px;padding:12px 0;overflow-x:auto}
  .tab{white-space:nowrap;display:flex;align-items:center;gap:8px;font-family:'Archivo',sans-serif;
       font-size:12.5px;font-weight:700;padding:8px 15px;border:1px solid var(--line);border-radius:20px;
       background:transparent;color:var(--mut);cursor:pointer;transition:.15s}
  .tab:hover{border-color:var(--accent);color:var(--ink)}
  .tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#0B0B0E}
  .tab[aria-selected="true"] .aud{background:rgba(0,0,0,.22);color:#0B0B0E;border-color:transparent}
  .aud{font-family:'Space Mono',monospace;font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;
       padding:2px 6px;border-radius:5px;border:1px solid var(--line);color:var(--mut)}
  .aud.internal{border-color:#3A3350;color:#B79CF0}
  .aud.client{border-color:#1E4B5C;color:#5FD0F5}

  main{padding:26px 0 70px}
  .panel[hidden]{display:none}
  .phead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:0 0 6px}
  .phead h2{margin:0;font-size:22px}
  .pintro{color:var(--mut);font-size:14px;margin:0 0 20px;max-width:780px}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px 24px;margin-bottom:16px}
  .card h3{font-size:16px;margin:20px 0 8px} .card h3:first-child{margin-top:0}
  .card p{margin:0 0 11px;font-size:14.5px} .card ul{margin:0 0 12px;padding-left:20px}
  .card li{font-size:14.5px;margin-bottom:5px}
  .empty{color:var(--mut);font-style:italic}
  .exlink{font-weight:600}
  .internal-note{border-left:3px solid #7B5FD0;background:#191627;border-radius:0 10px 10px 0;
                 padding:12px 16px;margin:14px 0}
  .internal-note .micro{color:#B79CF0} .internal-note p{margin:5px 0 0;font-size:13.5px;color:#D9D2F2}

  .cta{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--panel2);
       border:1px solid var(--accent);border-radius:14px;padding:16px 20px;margin-bottom:16px}
  .cta p{margin:0;font-size:14.5px;flex:1;min-width:220px}

  /* ---------- progress summary ---------- */
  .prog{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:15px 18px;margin-bottom:14px}
  .prow{display:flex;align-items:center;gap:13px;margin-bottom:9px;flex-wrap:wrap}
  .prow .micro{color:var(--mut)} .prow .spacer{flex:1}
  .pcount{font-family:'Archivo',sans-serif;font-weight:800;font-size:13.5px;color:var(--accent)}
  .ptrack{height:8px;background:#24242C;border-radius:99px;overflow:hidden}
  .pfill{height:100%;background:var(--accent);border-radius:99px;width:0;transition:width .35s ease}

  /* ---------- tables ---------- */
  .tablecard{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:18px}
  .scroll{overflow-x:auto}
  table{border-collapse:collapse;width:100%;min-width:860px}
  thead th{background:var(--panel2);border-bottom:1px solid var(--line);text-align:left;padding:12px 14px;
    font-family:'Space Mono',monospace;font-size:10px;font-weight:700;letter-spacing:.12em;
    text-transform:uppercase;color:var(--mut);white-space:nowrap}
  tbody td{border-bottom:1px solid var(--line);padding:12px 14px;font-size:14px;vertical-align:middle}
  tbody tr:last-child td{border-bottom:none}
  tbody tr:hover{background:#1B1B22}
  td.date{white-space:nowrap;font-weight:600;font-size:13.5px}
  td.title{min-width:300px}
  td.kw{font-size:13px;color:var(--mut)}
  .kwline{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .vol{font-family:'Space Mono',monospace;font-size:11px;color:var(--accent)}
  .monthsep td{background:#131318;font-family:'Space Mono',monospace;font-size:10.5px;letter-spacing:.14em;
               text-transform:uppercase;color:var(--mut);padding:9px 14px}

  .pill{display:inline-block;font-family:'Archivo',sans-serif;font-size:10.5px;font-weight:700;
        letter-spacing:.05em;text-transform:uppercase;padding:4px 10px;border-radius:20px;border:1px solid}
  .pill.started{border-color:#3A3A46;color:var(--mut)}
  .pill.for_approval{border-color:var(--warn);color:var(--warn)}
  .pill.approved{border-color:var(--ok);color:var(--ok)}
  .pill.scheduled{border-color:var(--r2r);color:var(--r2r)}
  .pill.live{border-color:var(--accent);color:var(--accent);background:rgba(255,255,255,.04)}
  .stage{display:inline-block;font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.08em;
         padding:3px 8px;border-radius:5px;border:1px solid var(--line);color:var(--mut)}
  .stage.TOFU{border-color:#2E5C7A;color:#6FB6E8}
  .stage.MOFU{border-color:#6B5730;color:#E2B463}
  .stage.BOFU{border-color:#2F6047;color:#5FC894}

  .tick{width:19px;height:19px;accent-color:var(--ok);cursor:pointer}
  .tick:disabled{cursor:not-allowed;opacity:.4}
  select,textarea{font-family:'Inter',sans-serif;background:var(--panel2);color:var(--ink);
    border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:13px}
  select:focus,textarea:focus{outline:none;border-color:var(--accent)}
  textarea.note{width:100%;min-height:64px;resize:vertical;font-size:13.5px}
  .notebtn{background:transparent;border:1px solid var(--line);border-radius:18px;padding:4px 11px;
    font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.06em;text-transform:uppercase;
    color:var(--mut);cursor:pointer}
  .notebtn:hover{border-color:var(--accent);color:var(--accent)}
  .notedot{width:6px;height:6px;border-radius:50%;background:var(--warn);display:inline-block;margin-left:5px}
  tr.noterow td{background:#131318;padding:0}
  .notewrap{padding:14px 16px;max-width:820px}
  .savebadge{font-size:11.5px;color:var(--mut);white-space:nowrap}
  .savebadge.ok{color:var(--ok)} .savebadge.err{color:var(--err)}

  footer{border-top:1px solid var(--line);padding:26px 0;color:var(--mut);font-size:12.5px}
  .foot{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:center}
  @media(max-width:640px){ table{min-width:720px} .card{padding:18px} }
</style>
</head>

></ul>"}, {"key": "audit", "label": "02 Technical Audit", "title": "Technical Audit", "audience": "both", "enabled": true, "intro": "A full health check of unleashplumbing.com.au \u2014 what's helping you, what's holding you back, and what we fix first. Landing Friday 7 August.", "html": "<h3>\ud83d\udd0d What we check</h3>\n<ul><li>\ud83c\udff7\ufe0f Page titles \u2014 are they clear, unique, and do they say what the page is actually for</li><li>\ud83d\udcdd Meta descriptions \u2014 the line under your listing that decides whether anyone clicks</li><li>\ud83c\udfd7\ufe0f Heading structure \u2014 how the page is organised, and whether AI engines can follow it</li><li>\ud83d\uddbc\ufe0f Alt tags \u2014 what your images tell Google and the engines they can't see</li><li>\ud83d\udd17 Internal links \u2014 whether your pages support each other or sit isolated</li><li>\u26a1 Speed and mobile \u2014 how the site behaves on a phone, on site, in a driveway</li><li>\ud83d\udcc4 Indexation \u2014 which pages Google has actually accepted, and which it's ignoring</li></ul>\n<h3>\ud83d\udcc5 When</h3>\n<p>The audit is being run now and will be ready by Friday 7 August. We'll walk you through it together before we touch a single thing on the site \u2014 nothing changes without your say-so.</p>\n<h3>\ud83d\udd0e Two things we already expect to find</h3>\n<ul><li>\ud83e\udd16 The sixty or so blog posts and service pages generated last month by the AI tool. They use AI stock images and were never checked for indexation \u2014 some may be worth keeping and rewriting, others are likely working against you.</li><li>\ud83d\udccd Your address is inconsistent across directories. Yellow Pages has 10 Cameron Rd, Hotfrog has 1 Cameron Rd, and you've just moved. Mismatched details confuse both Google and the AI engines about which business is which.</li></ul>"}, {"key": "gbp", "label": "03 GBP Optimisation", "title": "GBP Optimisation", "audience": "both", "enabled": true, "intro": "Your Google Business Profile is the single biggest lever on this plan. It's currently unverified \u2014 the address change knocked it out \u2014 so getting it verified is step zero.", "html": "<h3>\u23f3 Where it's at</h3>\n<p>Unverified. It won't show in Google Maps results and the posting schedule can't start until it clears. You've got the verification video to shoot \u2014 we've been through what's needed, and I'm on the end of the phone if it gets knocked back.</p>\n<h3>\ud83d\ude80 What we do the moment it's verified</h3>\n<ul><li>1\ufe0f\u20e3 Lock the profile down \u2014 categories, services, service area, hours and description, all set properly for roof plumbing across the eastern corridor</li><li>2\ufe0f\u20e3 Build out the Products section \u2014 the fastest win available on your profile, and the one most roofers never touch</li><li>3\ufe0f\u20e3 Start posting three times a week \u2014 real job photos, suburb by suburb \u2014 and put your review link to work</li></ul>\n<h3>\ud83d\udccc Worth knowing</h3>\n<p>Every Google Business Profile item on your calendar is waiting on this one step. If verification runs past mid-August we'll move those dates and tell you, rather than quietly reschedule them.</p>"}, {"key": "calendar-seo", "label": "04 Content Calendar (SEO)", "title": "Content Calendar", "audience": "client", "enabled": true, "intro": "", "html": ""}, {"key": "progress", "label": "08 Progress Tracker", "title": "Progress Tracker", "audience": "internal", "enabled": true, "intro": "", "html": ""}], "approvalTarget": "calendar-seo"};
const sb = supabase.createClient(CFG.sbUrl, CFG.sbKey);

let ME = null;          // {kind:'internal'|'client', name, clientId}
let ITEMS = [];         // ch_items rows
let INTERNAL = {};      // item_id -> ch_items_internal row (internal sessions only)
let STAFF = [];         // tt_people (internal sessions only)
let TABDOCS = {};       // internal tab prose, fetched not embedded
let CLIENT_ID = null;

const $  = id => document.getElementById(id);
const esc = s => (s ?? '').toString().replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const badge = (m,c='') => { const b=$('savebadge'); b.textContent=m; b.className='savebadge '+c;
                            if(c==='ok') setTimeout(()=>{ if(b.textContent===m) b.textContent=''; },2600); };

const CLIENT_STATUS = {
  started:      'Started',
  for_approval: 'For approval',
  approved:     'Approved',
  scheduled:    'Scheduled',
  live:         'Live'
};
const INTERNAL_STATUS = [
  ['not_started','Not started'],['started','Started'],['working','Working'],
  ['almost_done','Almost done'],['done','Done']
];

const fmtDate = iso => { const [y,m,d]=iso.split('-').map(Number);
  return d+' '+['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][m-1]; };
const monthLabel = key => { const [y,m]=key.split('-').map(Number);
  return ['January','February','March','April','May','June','July','August','September','October','November','December'][m-1]+' '+y; };

/* ---------------- auth ---------------- */
$('loginForm').addEventListener('submit', async e => {
  e.preventDefault(); $('loginErr').textContent=''; $('loginBtn').disabled=true;
  const { error } = await sb.auth.signInWithPassword({
    email: $('email').value.trim(), password: $('pw').value });
  $('loginBtn').disabled=false;
  if (error) { $('loginErr').textContent = 'Email or password not recognised.'; return; }
  boot();
});
$('logout').addEventListener('click', async () => { await sb.auth.signOut(); location.reload(); });

async function boot(){
  const { data:{ session } } = await sb.auth.getSession();
  if (!session) { $('loginView').classList.remove('hide'); $('appView').classList.add('hide'); return; }

  // Which kind of user is this? Ask the database, never the URL.
  const { data: clientRow } = await sb.from('ch_client_users')
    .select('client_id, full_name').eq('user_id', session.user.id).eq('active', true).maybeSingle();

  if (clientRow) {
    ME = { kind:'client', name: clientRow.full_name, clientId: clientRow.client_id };
  } else {
    const { data: staffRow } = await sb.from('tt_people')
      .select('name, role_title').eq('id', session.user.id).eq('active', true).maybeSingle();
    if (!staffRow) {
      await sb.auth.signOut();
      $('loginView').classList.remove('hide'); $('appView').classList.add('hide');
      $('loginErr').textContent = 'That login has no access to this hub.';
      return;
    }
    ME = { kind:'internal', name: staffRow.name, clientId: null };
  }

  // Resolve which client this hub belongs to. A client login can only ever
  // read its own row here, so a mismatch means they are on the wrong hub.
  const { data: c } = await sb.from('tt_clients').select('id,name').eq('slug', CFG.slug).maybeSingle();
  if (!c) {
    $('loginView').classList.remove('hide'); $('appView').classList.add('hide');
    $('loginErr').textContent = ME.kind==='client'
      ? 'This hub is not the one linked to your login.'
      : 'This client is not set up in the database yet.';
    await sb.auth.signOut();
    return;
  }
  CLIENT_ID = c.id;

  $('loginView').classList.add('hide'); $('appView').classList.remove('hide');
  $('whoChip').innerHTML = esc(ME.name) + ' &middot; <b>' + (ME.kind==='internal' ? 'Internal' : 'Client') + '</b>';

  await loadData();
  buildTabs();
}

/* ---------------- data ---------------- */
async function loadData(){
  const q = await sb.from('ch_items').select('*')
    .eq('client_id', CLIENT_ID).order('publish_date', {ascending:true}).order('sort_order');
  ITEMS = q.data || [];
  if (q.error) badge('Could not load the calendar.','err');

  if (ME.kind === 'internal') {
    const [ints, staff, tabDocs] = await Promise.all([
      sb.from('ch_items_internal').select('*'),
      sb.from('tt_people').select('id,name').eq('active', true).order('name'),
      sb.from('ch_tab_content').select('tab_key, body_html').eq('client_id', CLIENT_ID)
    ]);
    INTERNAL = Object.fromEntries((ints.data||[]).map(r => [r.item_id, r]));
    STAFF = staff.data || [];
    TABDOCS = Object.fromEntries((tabDocs.data||[]).map(r => [r.tab_key, r.body_html]));
  }
}

/* ---------------- tabs ---------------- */
function visibleTabs(){
  return CFG.tabs.filter(t => t.enabled && (ME.kind === 'internal' || t.audience !== 'internal'));
}

function buildTabs(){
  const tabs = visibleTabs();
  $('tabs').innerHTML = tabs.map((t,i) =>
    '<button class="tab" role="tab" data-key="'+t.key+'" aria-selected="'+(i===0)+'">'
    + esc(t.label)
    + (ME.kind==='internal' ? '<span class="aud '+t.audience+'">'
        + (t.audience==='internal'?'Internal':(t.audience==='client'?'Client':'Both')) + '</span>' : '')
    + '</button>').join('');

  $('panels').innerHTML = tabs.map((t,i) =>
    '<section class="panel" id="panel-'+t.key+'" '+(i===0?'':'hidden')+'></section>').join('');

  $('tabs').addEventListener('click', e => {
    const b = e.target.closest('.tab'); if (!b) return;
    selectTab(b.dataset.key);
  });
  tabs.forEach(t => renderPanel(t));
}

function selectTab(key){
  document.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-selected', String(b.dataset.key===key)));
  document.querySelectorAll('.panel').forEach(p => { p.hidden = (p.id !== 'panel-'+key); });
  window.scrollTo({top:0, behavior:'smooth'});
}

function renderPanel(t){
  const el = $('panel-'+t.key);
  const head = '<div class="phead"><h2>'+esc(t.title||t.label)+'</h2></div>'
             + (t.intro ? '<p class="pintro">'+esc(t.intro)+'</p>' : '');
  if (t.key === 'calendar-seo')      { el.innerHTML = head + calendarMarkup('seo'); wireCalendar(el,'seo'); return; }
  if (t.key === 'calendar-social')   { el.innerHTML = head + calendarMarkup('social'); wireCalendar(el,'social'); return; }
  if (t.key === 'progress')          { el.innerHTML = head + progressMarkup(); wireProgress(el); return; }

  // Internal tabs carry no prose in the file itself; it arrives from the database.
  let body = (t.remote ? TABDOCS[t.key] : t.html) || '<p class="empty">Nothing here yet.</p>';
  if (t.key === 'strategy' && CFG.approvalTarget) {
    body = '<div class="cta"><p><b>Ready to approve?</b> Open the content calendar and tick the items you are happy for us to publish.</p>'
         + '<button class="btn" type="button" id="goApprove">Go to the content calendar</button></div>' + body;
  }
  el.innerHTML = head + '<div class="card">' + body + '</div>';
  const go = el.querySelector('#goApprove');
  if (go) go.addEventListener('click', () => selectTab(CFG.approvalTarget));
}

/* ---------------- calendars ---------------- */
function rowsFor(cal){ return ITEMS.filter(r => r.calendar === cal); }

function calendarMarkup(cal){
  const rows = rowsFor(cal);
  if (!rows.length) return '<div class="card"><p class="empty">No items scheduled yet.</p></div>';
  const done = rows.filter(r => r.approved).length;
  const pct  = Math.round(done / rows.length * 100);

  let body = '', lastMonth = null;
  for (const r of rows) {
    if (r.month_key !== lastMonth) {
      lastMonth = r.month_key;
      body += '<tr class="monthsep"><td colspan="6">' + esc(monthLabel(r.month_key)) + '</td></tr>';
    }
    // Everything interpolated below is escaped, including fields currently
    // constrained by the schema. Defence in depth: a future migration that
    // loosens a CHECK must not silently open an injection point.
    const canTick = r.client_status !== 'started';
    const id = esc(r.id), st = esc(r.client_status), fs = esc(r.funnel_stage || '');
    body += '<tr data-id="'+id+'">'
      + '<td class="date">'+esc(fmtDate(r.publish_date))+'</td>'
      + '<td class="title">'+esc(r.title)
        + (fs ? ' <span class="stage '+fs+'">'+fs+'</span>' : '')
        + '<div><button class="notebtn" type="button" data-note="'+id+'">Notes'
        + (r.client_notes ? '<span class="notedot"></span>' : '') + '</button></div></td>'
      + '<td class="kw"><div class="kwline"><span>'+esc(r.main_keyword||'—')+'</span>'
        + (r.search_volume ? '<span class="vol">'+esc(r.search_volume)+'/mo</span>' : '') + '</div></td>'
      + '<td><span class="pill '+st+'">'+esc(CLIENT_STATUS[r.client_status]||r.client_status)+'</span></td>'
      + '<td style="text-align:center"><input class="tick" type="checkbox" data-approve="'+id+'"'
        + (r.approved?' checked':'') + (canTick?'':' disabled')
        + ' title="'+(canTick?'Approve this item':'Not ready for approval yet')+'"></td>'
      + '</tr>'
      + '<tr class="noterow" id="note-'+id+'" hidden><td colspan="6"><div class="notewrap">'
        + '<label>Your notes on this item</label>'
        + '<textarea class="note" data-notefor="'+id+'" placeholder="Anything you want changed before we publish?">'
        + esc(r.client_notes||'') + '</textarea></div></td></tr>';
  }

  return '<div class="prog"><div class="prow"><span class="micro">Approved</span>'
       + '<span class="pcount">'+done+' of '+rows.length+'</span><span class="spacer"></span>'
       + '<span class="micro">'+pct+'%</span></div>'
       + '<div class="ptrack"><div class="pfill" style="width:'+pct+'%"></div></div></div>'
       + '<div class="tablecard"><div class="scroll"><table><thead><tr>'
       + '<th>Date</th><th>Title</th><th>Query</th><th>Status</th><th style="text-align:center">Approve</th>'
       + '</tr></thead><tbody>' + body + '</tbody></table></div></div>';
}

function wireCalendar(el, cal){
  el.querySelectorAll('[data-note]').forEach(b => b.addEventListener('click', () => {
    const row = $('note-'+b.dataset.note); row.hidden = !row.hidden;
  }));

  el.querySelectorAll('[data-approve]').forEach(cb => cb.addEventListener('change', async () => {
    const id = cb.dataset.approve;
    cb.disabled = true; badge('Saving…');
    const { error } = await sb.from('ch_items').update({ approved: cb.checked }).eq('id', id);
    cb.disabled = false;
    if (error) { cb.checked = !cb.checked; badge('Could not save that.','err'); return; }
    const it = ITEMS.find(r => r.id === id);
    it.approved = cb.checked;
    it.client_status = cb.checked ? 'approved' : 'for_approval';
    badge('Saved','ok');
    refreshPanel(cal);
  }));

  el.querySelectorAll('[data-notefor]').forEach(ta => {
    let timer;
    ta.addEventListener('input', () => {
      clearTimeout(timer);
      timer = setTimeout(async () => {
        badge('Saving…');
        const { error } = await sb.from('ch_items')
          .update({ client_notes: ta.value || null }).eq('id', ta.dataset.notefor);
        if (error) { badge('Could not save that note.','err'); return; }
        const it = ITEMS.find(r => r.id === ta.dataset.notefor);
        it.client_notes = ta.value || null;
        badge('Saved','ok');
      }, 700);
    });
  });
}

function refreshPanel(cal){
  const key = 'calendar-'+cal;
  const t = CFG.tabs.find(x => x.key === key);
  const el = $('panel-'+key);
  if (!t || !el) return;
  const open = [...el.querySelectorAll('.noterow')].filter(r => !r.hidden).map(r => r.id);
  renderPanel(t);
  open.forEach(id => { const r = $(id); if (r) r.hidden = false; });
}

/* ---------------- progress (internal only) ---------------- */
function progressMarkup(){
  if (!ITEMS.length) return '<div class="card"><p class="empty">No items scheduled yet.</p></div>';
  const opts = id => INTERNAL_STATUS.map(([v,l]) =>
    '<option value="'+v+'"'+((INTERNAL[id]||{}).internal_status===v?' selected':'')+'>'+l+'</option>').join('');
  const staffOpts = id => '<option value="">Unassigned</option>' + STAFF.map(s =>
    '<option value="'+s.id+'"'+((INTERNAL[id]||{}).assigned_to===s.id?' selected':'')+'>'+esc(s.name)+'</option>').join('');

  let body='', lastMonth=null;
  for (const r of ITEMS) {
    if (r.month_key !== lastMonth) {
      lastMonth = r.month_key;
      body += '<tr class="monthsep"><td colspan="6">'+esc(monthLabel(r.month_key))+'</td></tr>';
    }
    const id = esc(r.id), st = esc(r.client_status);
    body += '<tr data-id="'+id+'">'
      + '<td class="date">'+esc(fmtDate(r.publish_date))+'</td>'
      + '<td class="title">'+esc(r.title)+'<div class="micro" style="color:var(--mut);margin-top:4px">'
        + esc(r.stream.replace('_',' '))+' &middot; '+esc(r.calendar.toUpperCase())+'</div></td>'
      + '<td><select data-assign="'+id+'">'+staffOpts(r.id)+'</select></td>'
      + '<td><select data-status="'+id+'">'+opts(r.id)+'</select></td>'
      + '<td><span class="pill '+st+'">'+esc(CLIENT_STATUS[r.client_status]||r.client_status)+'</span></td>'
      + '<td style="text-align:center">'+(r.approved?'<span class="pill approved">Ticked</span>':'—')+'</td>'
      + '</tr>';
  }
  return '<div class="card" style="margin-bottom:16px"><p style="margin:0;font-size:14px;color:var(--mut)">'
       + 'Marking an item <b style="color:var(--ink)">Done</b> here flips it to '
       + '<b style="color:var(--ink)">For approval</b> on the client calendar. The client never sees these stages.</p></div>'
       + '<div class="tablecard"><div class="scroll"><table><thead><tr>'
       + '<th>Date</th><th>Item</th><th>Assigned to</th><th>Internal status</th>'
       + '<th>Client sees</th><th style="text-align:center">Approved</th>'
       + '</tr></thead><tbody>'+body+'</tbody></table></div></div>';
}

function wireProgress(el){
  el.querySelectorAll('[data-status]').forEach(sel => sel.addEventListener('change', async () => {
    const id = sel.dataset.status;
    badge('Saving…');
    const { error } = await sb.from('ch_items_internal')
      .upsert({ item_id: id, internal_status: sel.value }, { onConflict: 'item_id' });
    if (error) { badge('Could not save that status.','err'); return; }
    INTERNAL[id] = Object.assign({}, INTERNAL[id], { item_id:id, internal_status: sel.value });
    // Re-read the row so the client-facing pill reflects what the trigger did.
    const { data } = await sb.from('ch_items').select('*').eq('id', id).maybeSingle();
    if (data) { const i = ITEMS.findIndex(r => r.id===id); if (i>=0) ITEMS[i] = data; }
    badge('Saved','ok');
    renderPanel(CFG.tabs.find(t => t.key === 'progress'));
    wireProgress($('panel-progress'));
  }));

  el.querySelectorAll('[data-assign]').forEach(sel => sel.addEventListener('change', async () => {
    const id = sel.dataset.assign;
    badge('Saving…');
    const { error } = await sb.from('ch_items_internal')
      .upsert({ item_id: id, assigned_to: sel.value || null }, { onConflict: 'item_id' });
    if (error) { badge('Could not save that.','err'); return; }
    INTERNAL[id] = Object.assign({}, INTERNAL[id], { item_id:id, assigned_to: sel.value || null });
    badge('Saved','ok');
  }));
}

boot();
</script>
</body>
</html>
